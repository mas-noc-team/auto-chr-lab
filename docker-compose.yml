networks:
  chr_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  chr1:
    image: mikrotik/chr:latest
    container_name: chr1
    privileged: true
    tty: true
    stdin_open: true
    restart: always
    command: sh -c "(sleep 3 && ifconfig eth0 promisc && ifconfig br0 promisc) & /start.sh"
    ports:
      - "8291:8291"
      - "2201:22"
      - "8081:80"
    networks:
      chr_net:
        ipv4_address: 172.20.0.10

